<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tutoriais | Fortes Engenharia</title>
<style>
  :root {
    --bg: #f5f7fa;
    --card: #ffffff;
    --text: #1b2433;
    --muted: #667085;
    --accent: #1f6feb;
    --accent-soft: #e8f0fe;
    --border: #e4e8ee;
    --shadow: 0 10px 30px rgba(20, 40, 80, .08);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f141b; --card: #171e28; --text: #e8edf4; --muted: #98a2b3;
      --accent: #5b9bff; --accent-soft: #1b2a44; --border: #263042;
      --shadow: 0 10px 30px rgba(0, 0, 0, .35);
    }
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    background: var(--bg); color: var(--text); line-height: 1.6;
  }
  header {
    text-align: center; padding: 64px 20px 40px;
  }
  .badge {
    display: inline-block; background: var(--accent-soft); color: var(--accent);
    font-size: .8rem; font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
    padding: 6px 14px; border-radius: 999px; margin-bottom: 18px;
  }
  h1 { font-size: clamp(1.9rem, 4vw, 2.8rem); font-weight: 700; letter-spacing: -.02em; }
  header p { color: var(--muted); max-width: 560px; margin: 12px auto 0; font-size: 1.05rem; }
  main {
    max-width: 1000px; margin: 0 auto; padding: 0 20px 72px;
    display: grid; gap: 32px;
  }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 18px;
    box-shadow: var(--shadow); overflow: hidden;
  }
  .card-head { display: flex; gap: 16px; align-items: center; padding: 22px 26px 8px; }
  .num {
    flex: none; width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center;
    background: var(--accent); color: #fff; font-weight: 700;
  }
  .card-head h2 { font-size: 1.25rem; }
  .card-head p { color: var(--muted); font-size: .95rem; }
  .player { padding: 14px 26px 26px; }
  video {
    width: 100%; display: block; border-radius: 12px; background: #000;
    aspect-ratio: 16 / 9;
  }
  footer { text-align: center; color: var(--muted); font-size: .85rem; padding: 0 20px 40px; }
  @media (max-width: 560px) {
    header { padding-top: 40px; }
    .card-head, .player { padding-left: 16px; padding-right: 16px; }
  }
</style>
</head>
<body>
  <header>
    <span class="badge">Tutorial</span>
    <h1>Aprenda passo a passo</h1>
    <p>Assista aos dois vídeos abaixo para entender como utilizar o sistema.</p>
  </header>

  <main>
    <section class="card">
      <div class="card-head">
        <div class="num">1</div>
        <div>
          <h2>Vídeo 1</h2>
          <p>Primeira parte do tutorial</p>
        </div>
      </div>
      <div class="player">
        <video controls preload="metadata" src="videos/tutorial-1.mp4"></video>
      </div>
    </section>

    <section class="card">
      <div class="card-head">
        <div class="num">2</div>
        <div>
          <h2>Vídeo 2</h2>
          <p>Segunda parte do tutorial</p>
        </div>
      </div>
      <div class="player">
        <video controls preload="metadata" src="videos/tutorial-2.mp4"></video>
      </div>
    </section>
  </main>

  <footer>Fortes Engenharia</footer>
</body>
</html>
